# Pre-merge checks: run on every pull request and on every push to main.
# They use the same commands as the local pre-commit hooks, so a green laptop means a green CI.
# Unlike the hooks, CI can't be skipped: it is the real gate.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the code. It never needs AWS or write access.
permissions:
  contents: read

# A new push to the same PR cancels the outdated run; runs on main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-quality:
    name: Backend quality (Ruff, mypy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to a full commit SHA: a tag can be moved to malicious code, a SHA can't
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # Don't leave the GitHub token in .git/config for later steps

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19" # Same uv as on the laptop

      # --locked fails if uv.lock is out of date with pyproject.toml, instead of silently re-resolving
      - name: Install dependencies exactly as locked
        run: uv sync --directory backend --locked

      # --check only reports; the local hook rewrites the files instead
      - name: Ruff format
        run: uv run --directory backend ruff format --check

      - name: Ruff check
        run: uv run --directory backend ruff check

      - name: mypy (strict)
        run: uv run --directory backend mypy .
