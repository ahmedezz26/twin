# Pre-merge checks: run on every pull request and on every push to main.
# They use the same commands as the local pre-commit hooks, so a green laptop means a green CI.
# Unlike the hooks, CI can't be skipped: it is the real gate.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the code. It never needs AWS or write access.
permissions:
  contents: read

# A new push to the same PR cancels the outdated run; runs on main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-quality:
    name: Backend quality (Ruff, mypy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to a full commit SHA: a tag can be moved to malicious code, a SHA can't
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # Don't leave the GitHub token in .git/config for later steps

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19" # Same uv as on the laptop

      # --locked fails if uv.lock is out of date with pyproject.toml, instead of silently re-resolving
      - name: Install dependencies exactly as locked
        run: uv sync --directory backend --locked

      # --check only reports; the local hook rewrites the files instead
      - name: Ruff format
        run: uv run --directory backend ruff format --check

      - name: Ruff check
        run: uv run --directory backend ruff check

      - name: mypy (strict)
        run: uv run --directory backend mypy .

  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"

      - name: Install dependencies exactly as locked
        run: uv sync --directory backend --locked

      # No secrets and no network needed: tests/conftest.py fakes the LLM, Telegram and AWS
      - name: pytest
        run: uv run --directory backend pytest -q --cov

      # Shows the coverage table on the run's summary page, even when a test failed
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: uv run --directory backend coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # Current LTS; deploy.yml must build with the same version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --ignore-scripts: packages can't run install scripts, the way npm supply-chain worms spread
      - name: Install dependencies exactly as locked
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint

      # Also type-checks the TypeScript; no API URL is needed to build
      - name: Build
        run: npm run build

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4" # Same Terraform as on the laptop
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -diff

      # -backend=false skips the S3 state, so CI needs no AWS credentials.
      # -lockfile=readonly fails if .terraform.lock.hcl is out of date, like uv's --locked.
      - name: terraform init
        run: terraform init -backend=false -input=false -lockfile=readonly

      # validate evaluates filebase64sha256() on the Lambda zip, which only deploy.py builds: an empty placeholder is enough
      - name: terraform validate
        run: |
          touch ../backend/lambda-deployment.zip
          terraform validate
