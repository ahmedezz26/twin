# Evals: ask the real model the golden questions, judge the answers, compare with evals/baseline.json.
# They cost money (~$0.14 a full run), so a PR runs them only when it can change the twin's answers:
# the prompt, the data, the tools, the model setting, or the evals themselves. Anyone with write access
# can also start them by hand (Actions tab → Evals → Run workflow).
name: Evals

on:
  pull_request:
  workflow_dispatch:

# Least privilege: read the code, nothing else. The OpenRouter key comes from a secret, not a token.
# Accepted risk (zizmor secrets-outside-env): the key is a repository secret, not an environment secret.
# Only this repo's reviewed workflows can read it (never fork or Dependabot PRs), and it has a small credit limit.
permissions:
  contents: read

# A new push to the same PR cancels the outdated (and paid) run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    name: Evals (twin behaviour)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history, to list the files this PR changes

      # The job always runs and reports success when it decides to skip. Skipping the whole workflow
      # (a `paths:` filter) would leave a required check waiting forever and block the PR.
      - name: Decide whether to run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_KEY: ${{ secrets.EVALS_OPENROUTER_API_KEY != '' }} # zizmor: ignore[secrets-outside-env]
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Evals skipped: no EVALS_OPENROUTER_API_KEY here (Dependabot and fork PRs get no secrets)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Three dots: only what this PR changed since it branched off
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          if echo "$changed" | grep -qE '^(backend/(context|resources|server|tools|knowledge)\.py|backend/data/|backend/evals/|terraform/terraform\.tfvars|\.github/workflows/evals\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Evals skipped: this PR doesn't change the prompt, data, tools, model or evals." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Reuse: if an earlier run of THIS PR passed with exactly the same files that can change the answers,
      # in the same ISO week, report its result instead of paying again (e.g. after a README-only push).
      # Only passes are remembered, the week limits staleness (providers can change a model silently),
      # and a manual run always runs fresh. A PR's cache is only readable by later runs of that same PR.
      - name: Fingerprint what can change the answers
        if: steps.decide.outputs.run == 'true'
        id: fingerprint
        env:
          FILES_HASH: ${{ hashFiles('backend/context.py', 'backend/resources.py', 'backend/server.py', 'backend/tools.py', 'backend/knowledge.py', 'backend/data/**', 'backend/evals/**', 'terraform/terraform.tfvars', '.github/workflows/evals.yml') }}
        run: echo "key=evals-passed-$(date -u +%G-W%V)-$FILES_HASH" >> "$GITHUB_OUTPUT"

      - name: Look for an earlier passing run with the same fingerprint
        if: steps.decide.outputs.run == 'true' && github.event_name == 'pull_request'
        id: reuse
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .evals-passed
          key: ${{ steps.fingerprint.outputs.key }}
          lookup-only: true # only "does it exist?": nothing from the cache is downloaded or run

      - name: Reuse the earlier result
        if: steps.reuse.outputs.cache-hit == 'true'
        run: |
          echo "Evals reused: an earlier run of this PR passed this week with identical prompt, data, tools, model setting and evals." | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.decide.outputs.run == 'true' && steps.reuse.outputs.cache-hit != 'true'
        with:
          version: "0.12.19"

      - name: Install dependencies exactly as locked
        if: steps.decide.outputs.run == 'true' && steps.reuse.outputs.cache-hit != 'true'
        run: uv sync --directory backend --locked

      # Real model + judge; fails on any invented claim, a failed critical case, or a drop below the baseline
      - name: Run the evals
        id: evals
        if: steps.decide.outputs.run == 'true' && steps.reuse.outputs.cache-hit != 'true'
        env:
          EVALS_OPENROUTER_API_KEY: ${{ secrets.EVALS_OPENROUTER_API_KEY }} # zizmor: ignore[secrets-outside-env]
        run: uv run --directory backend python -m evals.run

      # Every answer, for reading after a red run (the table is also on the run's summary page).
      # !cancelled() is needed: without a status function GitHub adds success() and skips this after a failure.
      - name: Keep the full report
        if: ${{ !cancelled() && (steps.evals.outcome == 'success' || steps.evals.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          path: backend/evals/reports/
          retention-days: 30

      # Remember the pass (a tiny marker; only its key matters). Never remembers a failure.
      - name: Mark this fingerprint as passed
        if: steps.evals.conclusion == 'success' && github.event_name == 'pull_request'
        run: mkdir -p .evals-passed && date -u > .evals-passed/at

      - name: Remember this passing result
        if: steps.evals.conclusion == 'success' && github.event_name == 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .evals-passed
          key: ${{ steps.fingerprint.outputs.key }}
