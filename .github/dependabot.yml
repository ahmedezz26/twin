# Keeps the SHA-pinned actions in .github/workflows up to date: one PR a week that bumps the SHA
# and its "# vX.Y.Z" comment together. CI runs on that PR like on any other, so a bad update can't merge.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release: compromised releases are usually caught and pulled within days
    cooldown:
      default-days: 7
    # All action updates in one PR instead of one PR per action
    groups:
      github-actions:
        patterns: ["*"]

  # The same for the images in backend/Dockerfile: bumps the tag and its @sha256 digest together.
  # Registries publish no release dates, so the cooldown can't apply here (accepted: official images, and CI must pass).
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # Python stays on 3.13 like the Lambda runtime: only the weekly rebuilds of 3.13 (OS security patches) come through
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # uv is upgraded by hand in the Dockerfile, ci.yml and deploy.yml together, so they never differ
      - dependency-name: "*astral-sh/uv"
