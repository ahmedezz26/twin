# Checks that run automatically: fast ones before every `git commit`, the tests before every `git push`.
# Install once per clone with: uv run --project backend pre-commit install
# They use the project's own Ruff, mypy and pytest from uv.lock, so the versions match the terminal and CI exactly.
# This is a convenience: CI on the pull request is the real gate (a hook can be skipped with --no-verify).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: mypy
        name: mypy (strict)
        entry: uv run --directory backend mypy .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      # Tests run before code leaves the laptop, not on every commit: commits stay instant even when tests get slower
      - id: pytest
        name: pytest
        entry: uv run --directory backend pytest -q
        language: system
        files: ^backend/
        pass_filenames: false
        stages: [pre-push]
