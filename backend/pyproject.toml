[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.103",
    "dnspython>=2.8.0",
    "fastapi>=0.141.1",
    "mangum>=0.22.0",
    "openai>=3.19.2",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "moto[s3,ssm]>=5.2.3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "types-boto3[s3,ssm]>=1.43.111",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# On top of Ruff's default rules: bugbear, security, timezone-aware datetimes, simplifications
extend-select = ["B", "S", "DTZ", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Build script: runs a fixed docker command we control, not user input
"deploy.py" = ["S603", "S607"]
# Tests: assert is how pytest checks results (S101), and test secrets are fake (S105, S106)
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The backend is flat modules (server.py, tools.py...), not a package: let tests import them directly
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
# Measure the app, not the tests themselves
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.13"
strict = true
# Lets mypy understand Pydantic models and Settings (field types, constructors)
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/", "^lambda-package/"]
# Name test files tests.test_api etc. (there is no tests/__init__.py), so the override below can match them
explicit_package_bases = true

[[tool.mypy.overrides]]
# Tests: test functions and fixtures may skip annotations, but their bodies are still checked
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[tool.pydantic-mypy]
init_typed = true
