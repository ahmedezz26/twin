[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.103",
    "dnspython>=2.8.0",
    "fastapi>=0.141.1",
    "mangum>=0.22.0",
    "openai>=3.19.2",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# On top of Ruff's default rules: bugbear, security, timezone-aware datetimes, simplifications
extend-select = ["B", "S", "DTZ", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Build script: runs a fixed docker command we control, not user input
"deploy.py" = ["S603", "S607"]
